<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Arcade</title>

<style>
  body {
    margin: 0;
    background: black;
    color: #00ff00;
    font-family: "Courier New", monospace;
    text-align: center;
    overflow: hidden;
  }

  .screen {
    display: none;
    height: 100vh;
  }

  .active {
    display: block;
  }

  button {
    font-size: 18px;
    padding: 12px 18px;
    margin: 8px;
    background: black;
    color: #00ff00;
    border: 2px solid #00ff00;
  }

  button:hover {
    background: #00ff00;
    color: black;
    cursor: pointer;
  }

  input {
    font-size: 20px;
    padding: 10px;
    width: 100px;
    background: black;
    color: #00ff00;
    border: 2px solid #00ff00;
    text-align: center;
  }

  canvas {
    display: block;
    margin: 0 auto;
    border: 2px solid #00ff00;
    background: black;
  }

  .controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 40px;
    box-sizing: border-box;
  }

  .arrow {
    font-size: 45px;
    border: 2px solid #00ff00;
    padding: 10px 25px;
    user-select: none;
  }

  #countdown {
    position: absolute;
    top: 45%;
    width: 100%;
    font-size: 80px;
    color: #00ff00;
  }
</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="screen active">

  <h1>RETRO ARCADE</h1>

  <div>
    <h3>GUESS GAME (1-10)</h3>
    <input type="number" id="guess" min="1" max="10">
    <button onclick="checkGuess()">SUBMIT</button>
    <p id="guessResult"></p>
    <button id="retryGuess" onclick="resetGuess()" style="display:none;">RETRY</button>
  </div>

  <hr style="border-color:#00ff00;">

  <button onclick="blackStart()">SPACE INVADERS</button>
</div>

<!-- BLACK SCREEN -->
<div id="blackScreen" class="screen"></div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <canvas id="game"></canvas>
  <div id="countdown"></div>

  <div class="controls">
    <div class="arrow" id="leftBtn">⬅</div>
    <div class="arrow" id="rightBtn">➡</div>
  </div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
  <h1 id="endText"></h1>
  <button onclick="retry()">RETRY</button>
  <button onclick="backMenu()">MENU</button>
</div>

<script>

/* ================= GUESS ================= */
let rand = Math.floor(Math.random() * 10) + 1;

function checkGuess() {
  let g = Number(document.getElementById("guess").value);
  let r = document.getElementById("guessResult");

  if (g < 1 || g > 10) {
    r.textContent = "1 - 10 ONLY";
    return;
  }

  if (g < rand) r.textContent = ">> MORE";
  else if (g > rand) r.textContent = ">> LESS";
  else {
    r.textContent = ">> CORRECT!";
    document.getElementById("retryGuess").style.display = "inline-block";
  }
}

function resetGuess() {
  rand = Math.floor(Math.random() * 10) + 1;
  document.getElementById("guessResult").textContent = "";
  document.getElementById("guess").value = "";
  document.getElementById("retryGuess").style.display = "none";
}

/* ================= SCREEN ================= */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ================= START ================= */
function blackStart() {
  show("blackScreen");

  setTimeout(() => {
    startCountdown();
  }, 500);
}

function startCountdown() {
  show("gameScreen");

  let cd = document.getElementById("countdown");
  let count = 3;

  cd.textContent = count;

  let interval = setInterval(() => {
    count--;

    if (count > 0) {
      cd.textContent = count;
    } else if (count === 0) {
      cd.textContent = "GO!";
    } else {
      clearInterval(interval);
      cd.textContent = "";
      startGame();
    }
  }, 800);
}

/* ================= GAME ================= */
let canvas, ctx;
let player, bullets, enemies;
let left = false, right = false;
let shootLoop;
let running = false;

function startGame() {
  canvas = document.getElementById("game");
  ctx = canvas.getContext("2d");

  resize();

  player = {
    x: canvas.width / 2,
    y: canvas.height - 90,
    speed: 9
  };

  bullets = [];
  enemies = [];

  let count = Math.floor(canvas.width / 120);

  for (let i = 0; i < count; i++) {
    enemies.push({
      x: (i + 1) * (canvas.width / (count + 1)),
      y: 30,
      size: 18,
      speed: 0.2 + Math.random() * 0.4
    });
  }

  running = true;

  shootLoop = setInterval(() => {
    bullets.push({ x: player.x + 18, y: player.y });
  }, 250);

  requestAnimationFrame(loop);
}

/* ================= RESIZE ================= */
function resize() {
  canvas.width = window.innerWidth * 0.95;
  canvas.height = window.innerHeight * 0.85;
}

window.addEventListener("resize", () => {
  if (canvas) resize();
});

/* ================= CONTROLS ================= */
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") left = true;
  if (e.key === "ArrowRight") right = true;
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") left = false;
  if (e.key === "ArrowRight") right = false;
});

/* clickable arrows */
document.getElementById("leftBtn").addEventListener("mousedown", () => left = true);
document.getElementById("leftBtn").addEventListener("mouseup", () => left = false);

document.getElementById("rightBtn").addEventListener("mousedown", () => right = true);
document.getElementById("rightBtn").addEventListener("mouseup", () => right = false);

/* ================= LOOP ================= */
function loop() {
  if (!running) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* player */
  if (left) player.x -= player.speed;
  if (right) player.x += player.speed;

  player.x = Math.max(0, Math.min(canvas.width - 50, player.x));

  ctx.fillStyle = "#00aaff";
  ctx.fillRect(player.x + 18, player.y, 14, 40);
  ctx.fillRect(player.x, player.y + 20, 50, 18);
  ctx.fillRect(player.x + 10, player.y + 8, 30, 12);

  /* ================= BULLETS (WIDER + SLOWER) ================= */
  ctx.fillStyle = "#00ff00";
  bullets.forEach((b, i) => {

    b.y -= 4; // 🐢 slower than before

    // 🔥 WIDER SHOTS
    ctx.fillRect(b.x, b.y, 22, 12);

    if (b.y < 0) bullets.splice(i, 1);
  });

  /* enemies */
  enemies.forEach((e, ei) => {

    e.y += e.speed;

    ctx.fillRect(e.x, e.y, e.size, e.size);
    ctx.fillRect(e.x + 4, e.y + 5, 10, 6);
    ctx.fillRect(e.x + 6, e.y + 12, 6, 3);

    if (e.y > canvas.height) end("YOU DIED");

    if (
      e.x < player.x + 50 &&
      e.x + e.size > player.x &&
      e.y < player.y + 40 &&
      e.y + e.size > player.y
    ) {
      end("YOU DIED");
    }

    bullets.forEach((b, bi) => {
      if (
        b.x < e.x + e.size &&
        b.x + 22 > e.x &&
        b.y < e.y + e.size &&
        b.y + 12 > e.y
      ) {
        enemies.splice(ei, 1);
        bullets.splice(bi, 1);
      }
    });
  });

  if (enemies.length === 0) end("YOU WIN");

  requestAnimationFrame(loop);
}

/* ================= END ================= */
function end(text) {
  running = false;
  clearInterval(shootLoop);

  show("endScreen");
  document.getElementById("endText").textContent = text;
}

/* ================= BUTTONS ================= */
function retry() {
  blackStart();
}

function backMenu() {
  show("menu");
}

</script>

</body>
</html>
